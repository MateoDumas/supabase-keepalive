name: Manual Supabase Ping

on:
  workflow_dispatch:       # Solo ejecución manual on-demand

jobs:
  manual-ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install @supabase/supabase-js dotenv
        
      - name: Run Manual Ping
        run: node ping-supabase.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
